name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          : > ~/.ssh/known_hosts
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi

          # known_hosts da aynan shu host uchun yozuv bormi? Port 22 bo'lmasa
          # yozuv [host]:port ko'rinishida bo'ladi.
          if [ "$SSH_PORT" = "22" ]; then
            lookup="$SSH_HOST"
          else
            lookup="[$SSH_HOST]:$SSH_PORT"
          fi

          if ! ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            # Yozuv yo'q yoki secret boshqa hostniki — kalitni serverdan olamiz
            # (TOFU). Bu birinchi ulanishda MITM'dan himoya qilmaydi; qat'iyroq
            # tekshiruv uchun SSH_KNOWN_HOSTS ga to'g'ri qiymat yozing.
            echo "::warning::known_hosts da $SSH_HOST uchun yozuv yo'q — ssh-keyscan ishlatilmoqda"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          if ! [ -s ~/.ssh/known_hosts ]; then
            echo "::error::Host kaliti olinmadi. SSH_HOST/SSH_PORT to'g'rimi yoki port tashqaridan ochiqmi?"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload project
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'apps/forwardtogroup' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'targets.txt' \
            --exclude '.venv' \
            --exclude '*.session' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Write .env on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'apps/forwardtogroup' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # .env stdin orqali uzatiladi — qiymatlar buyruq argumentlariga tushmaydi.
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" \
            | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                "umask 077 && cat > '$DEPLOY_PATH/.env'"

      - name: Install dependencies
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'apps/forwardtogroup' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt"
